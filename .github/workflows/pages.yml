# GitHub Pages 배포 (PNDES 생기포털 프론트엔드 프로토타입 + 05.리포트 산출물)
# (Pages Source를 GitHub Actions로 설정한 이후 최초 배포 트리거, 2026-09-03)
#
# src/frontend/ 폴더(jQuery+HTML5 정적 프로토타입)와 05.리포트/ 폴더(온디맨드 파생 자료,
# 화면설계서 샘플 등)를 함께 GitHub Pages로 배포합니다.
# main 브랜치에 push될 때마다 자동 실행되며,
#   - https://kbt8918.github.io/PLM/            (src/frontend)
#   - https://kbt8918.github.io/PLM/reports/    (05.리포트)
# 에서 확인할 수 있습니다.
#
# 참고: CLAUDE.md Tech Stack 지침에 따라 이 프로젝트는 Next.js가 아닌 정적 jQuery+HTML5
# 프로토타입이므로, 두 폴더를 스테이징 디렉토리로 합쳐 그대로 Pages 아티팩트로 업로드하는
# 방식을 사용합니다. (ci.yml의 Next.js 기반 배포 안내와는 무관합니다.)

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'src/frontend/**'
      - '05.리포트/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages site
        run: |
          mkdir -p _site
          cp -r src/frontend/. _site/
          mkdir -p _site/reports
          cp -r "05.리포트/." _site/reports/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
