name: Design Import Sync Notify

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/design-import/**'
      - 'design_handoff_생기포털/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show changed design files
        run: |
          echo "Design files updated in this push:"
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- src/frontend/design-import design_handoff_생기포털

